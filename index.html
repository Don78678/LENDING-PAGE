
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Join Tony Delhi on Telegram for updates and community content.">
  <title>Tony Delhi | Telegram Community</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --background: #050505;
      --card: #111111;
      --text: #ffffff;
      --muted: #a1a1a1;
      --accent: #d6ff00;
      --border: #252525;
    }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(ellipse at top, #1b1b1b 0%, #050505 55%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      margin-bottom: 30px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .brand-dot {
      width: 8px;
      height: 8px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 12px rgba(214, 255, 0, 0.7);
    }

    .card {
      background: linear-gradient(145deg, #151515, #090909);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 42px 28px;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5);
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 25px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #1d1d1d;
      border: 2px solid var(--accent);
      color: var(--accent);
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -2px;
      box-shadow: 0 0 35px rgba(214, 255, 0, 0.08);
    }

    h1 {
      font-size: clamp(32px, 8vw, 42px);
      font-weight: 900;
      letter-spacing: -1.5px;
      margin-bottom: 12px;
    }

    h1 span {
      color: var(--accent);
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 330px;
      margin: 0 auto 28px;
    }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 25px 0;
    }

    .community-label {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .join-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 17px 20px;
      background: var(--accent);
      color: #080808;
      text-decoration: none;
      font-size: 16px;
      font-weight: 800;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .join-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(214, 255, 0, 0.2);
    }

    .telegram-icon {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }

    .note {
      color: #777777;
      font-size: 12px;
      line-height: 1.6;
      margin-top: 20px;
    }

    footer {
      margin-top: 24px;
      color: #555555;
      font-size: 11px;
      letter-spacing: 1px;
    }

    @media (max-width: 420px) {
      .card {
        padding: 35px 22px;
      }

      .subtitle {
        font-size: 14px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <div class="brand">
      <span class="brand-dot"></span>
      TONY DELHI
    </div>

    <section class="card">

      <div class="logo" aria-label="Tony Delhi logo">
        TD
      </div>

      <h1>TONY <span>DELHI</span></h1>

      <p class="subtitle">
        Welcome to the official Tony Delhi Telegram community.
        Join us and stay connected with the latest updates.
      </p>

      <div class="divider"></div>

      <p class="community-label">
        Join Our Telegram Community
      </p>

      <a
        class="join-button"
        href="https://t.me/+zOLFu7H-DwM3ZGVl"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg class="telegram-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M21.9 3.1a1.5 1.5 0 0 0-1.6-.2L2.8 9.7a1.5 1.5 0 0 0 .1 2.8l4.5 1.5 1.7 5.2a1.5 1.5 0 0 0 2.6.5l2.8-3.4 4.2 3.1a1.5 1.5 0 0 0 2.4-.9l2.1-13.8a1.5 1.5 0 0 0-1.3-1.6ZM9.1 13.6l8.5-6.8-6.7 8.2-.3 2.8-1.5-4.2Z"/>
        </svg>
        JOIN TELEGRAM
      </a>

      <p class="note">
        Tap the button above to open Telegram and join the community.
      </p>

    </section>

    <footer>
      © <span id="year">2026</span> TONY DELHI
    </footer>

  </main>
</body>
</html>
